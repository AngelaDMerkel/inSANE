<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffdf9">
  <meta name="application-name" content="inSANE">
  <meta name="description" content="A web document builder for network and USB scanners.">
  <title>inSANE</title>
  <link rel="icon" href="/brand/insane-favicon.svg?v=base-06-feed-layer" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/app.css?v=workbench-37">
</head>
<body>
  <div class="app-shell">
    <main class="workbench">
      <aside class="scan-sidebar" aria-label="Scan settings">
        <div class="sidebar-brand">
          <img class="sidebar-brand-lockup" src="/brand/insane-header-lockup.svg?v=base-06-feed-layer" alt="inSANE">
        </div>
        <div id="settings-panel" class="settings-form">
          <div class="floating-sheet identity-sheet">
            <label class="field device-field">
              <span class="visually-hidden">Device</span>
              <span class="device-select-wrap"><span class="device-inline-status" aria-hidden="true"></span><select id="device" aria-label="Device"><option>Finding scanners…</option></select></span>
            </label>

            <div class="field profile-field">
              <span class="visually-hidden">Saved profile</span>
              <div class="profile-row">
                <select id="profile" aria-label="Saved profile"><option value="">Custom</option></select>
                <div class="profile-utilities">
                  <button id="new-profile" class="profile-utility" type="button" title="Save current settings as a new profile" aria-label="New scan profile" aria-controls="profile-dialog" aria-expanded="false">
                    <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.4v7.2M2.4 6h7.2"></path></svg>
                  </button>
                  <button id="manage-profiles" class="profile-utility profile-manage" type="button" title="Manage scan profiles" aria-label="Manage scan profiles" aria-controls="profile-manager-dialog" aria-expanded="false">
                    <svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="2.4" cy="6" r=".8"></circle><circle cx="6" cy="6" r=".8"></circle><circle cx="9.6" cy="6" r=".8"></circle></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="floating-sheet inspector-rows">
            <label class="inspector-row">
              <span>Source</span>
              <select id="paper-source" aria-label="Paper source">
                <option value="duplex">Duplex ADF</option>
                <option value="feeder">Feeder</option>
                <option value="flatbed">Flatbed</option>
              </select>
            </label>
            <label class="inspector-row">
              <span>Size</span>
              <select id="page-size" aria-label="Paper size">
                <option value="auto">Automatic</option>
                <option value="letter" selected>US Letter</option>
                <option value="legal">US Legal</option>
                <option value="a4">A4</option>
              </select>
            </label>
            <label class="inspector-row">
              <span>Resolution</span>
              <select id="resolution">
                <option value="200">200 dpi</option>
                <option value="300" selected>300 dpi</option>
                <option value="600">600 dpi</option>
              </select>
            </label>
            <label class="inspector-row">
              <span>Bit depth</span>
              <select id="bit-depth">
                <option value="color">Colour</option>
                <option value="grayscale">Greyscale</option>
                <option value="blackAndWhite">Black &amp; white</option>
              </select>
            </label>
          </div>

          <div class="floating-sheet enhancements-sheet">
            <fieldset class="inspector-toggles">
              <legend class="visually-hidden">Enhancements</legend>
              <label class="inspector-toggle-row"><span>Deskew</span><input id="auto-deskew" type="checkbox" checked></label>
              <label class="inspector-toggle-row"><span>Skip blanks</span><input id="discard-blank-pages" type="checkbox"></label>
            </fieldset>

            <details class="advanced-options">
              <summary>Advanced</summary>
              <div class="advanced-fields">
                <label class="range-field">
                  <span>Brightness <output id="brightness-value" for="brightness">0</output></span>
                  <input id="brightness" type="range" min="-1000" max="1000" step="50" value="0">
                </label>
                <label class="range-field">
                  <span>Contrast <output id="contrast-value" for="contrast">0</output></span>
                  <input id="contrast" type="range" min="-1000" max="1000" step="50" value="0">
                </label>
                <div class="advanced-thresholds">
                  <label class="field compact-field">
                    <span>White threshold</span>
                    <div class="number-field"><input id="blank-white-threshold" type="number" min="0" max="100" value="70"><span>%</span></div>
                  </label>
                  <label class="field compact-field">
                    <span>Coverage</span>
                    <div class="number-field"><input id="blank-coverage-threshold" type="number" min="0" max="100" value="15"><span>%</span></div>
                  </label>
                </div>
              </div>
            </details>
          </div>
        </div>

        <section id="profile-dialog" class="profile-overlay floating-sheet" aria-label="New scan profile" hidden>
          <form id="profile-form">
            <div class="profile-overlay-header">
              <strong>New profile</strong>
              <button class="profile-overlay-close" type="button" id="profile-cancel" aria-label="Close new profile">
                <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3.25 3.25 5.5 5.5m0-5.5-5.5 5.5"></path></svg>
              </button>
            </div>
            <div class="profile-overlay-content">
              <label class="profile-overlay-field"><span>Name</span><input id="profile-name" required placeholder="Duplex Letter"></label>
              <button class="button primary wide" type="submit">Save profile</button>
            </div>
          </form>
        </section>

        <section id="profile-manager-dialog" class="profile-overlay profile-manager-overlay floating-sheet" aria-label="Scan profiles" hidden>
          <div class="profile-manager-shell">
            <div class="profile-overlay-header">
              <strong>Profiles</strong>
              <button class="profile-overlay-close" type="button" id="profile-manager-close" aria-label="Close profile manager">
                <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3.25 3.25 5.5 5.5m0-5.5-5.5 5.5"></path></svg>
              </button>
            </div>
            <div id="profile-manager-list" class="profile-manager-list"></div>
            <div class="profile-manager-footer">
              <button class="button quiet wide" type="button" id="profile-manager-new">New profile</button>
            </div>
          </div>
        </section>

        <div class="scan-actions">
          <div id="device-status" class="device-status" hidden></div>
          <div id="scan-progress" class="scan-progress" hidden>
            <div class="scan-progress-row"><span id="progress-label">Receiving page 1</span><span id="progress-value">0%</span></div>
            <progress id="progress" max="1" value="0"></progress>
          </div>
          <div id="scan-error" class="scan-error" hidden>
            <strong id="scan-error-title">Scan interrupted</strong>
            <p id="scan-error-message"></p>
            <p id="scan-error-recovery"></p>
            <div class="button-pair">
              <button id="dismiss-scan-error" class="button quiet small" type="button">Dismiss</button>
              <button id="retry-scan" class="button primary small" type="button">Retry</button>
            </div>
          </div>
          <button id="scan" class="button scan-button" type="button" title="Scan pages (⌘/Ctrl + Enter)" aria-keyshortcuts="Meta+Enter Control+Enter">
            <span class="scan-dot" aria-hidden="true"></span><span id="scan-label">Scan pages</span>
          </button>
        </div>
      </aside>

      <section class="document-workspace" aria-label="Document canvas">
        <div id="canvas" class="canvas">
          <div class="canvas-controls" aria-label="Canvas controls" hidden>
            <div class="zoom-controls">
              <button id="zoom-out" class="icon-button compact" type="button" title="Zoom out (⌘/Ctrl −)" aria-label="Zoom out">−</button>
              <span id="zoom-label">72%</span>
              <button id="zoom-in" class="icon-button compact" type="button" title="Zoom in (⌘/Ctrl +)" aria-label="Zoom in">＋</button>
            </div>
          </div>
          <div class="canvas-viewport">
            <div id="empty-canvas" class="empty-canvas">
              <div class="empty-icon" aria-hidden="true">▤</div>
              <h2>Build a document</h2>
              <p>Choose a scanner and start a scan. Pages will collect here until you decide to save them.</p>
              <button id="empty-scan" class="button primary" type="button">Scan first pages</button>
            </div>
            <div id="page-stage" class="page-stage" hidden>
              <div id="page-image-frame" class="page-image-frame">
                <img id="page-image" alt="Selected scanned page" draggable="false">
              </div>
              <div id="crop-overlay" class="crop-overlay" aria-label="Crop frame. Drag the frame to move it or drag a handle to resize it." hidden>
                <span class="crop-handle nw" data-crop-handle="nw"></span>
                <span class="crop-handle n" data-crop-handle="n"></span>
                <span class="crop-handle ne" data-crop-handle="ne"></span>
                <span class="crop-handle e" data-crop-handle="e"></span>
                <span class="crop-handle se" data-crop-handle="se"></span>
                <span class="crop-handle s" data-crop-handle="s"></span>
                <span class="crop-handle sw" data-crop-handle="sw"></span>
                <span class="crop-handle w" data-crop-handle="w"></span>
              </div>
            </div>
          </div>
        </div>

        <section class="filmstrip page-carousel" aria-label="Scanned pages">
          <span id="page-count" class="visually-hidden" aria-live="polite">0</span>
          <div id="page-list" class="page-list"></div>
        </section>
      </section>

      <aside class="document-sidebar" aria-label="Document and history">
        <div id="inspector-panel" class="inspector-panel">
          <section id="page-management" class="page-management floating-sheet" hidden>
            <div class="page-focus-row">
              <button id="page-focus-number" class="page-focus-number" type="button" title="1 page selected" aria-label="1 page selected">
                <span class="page-focus-sheet page-focus-sheet-back-two" aria-hidden="true"></span>
                <span class="page-focus-sheet page-focus-sheet-back-one" aria-hidden="true"></span>
                <span class="page-focus-sheet page-focus-sheet-front" aria-hidden="true"></span>
                <span id="page-focus-count" class="page-focus-count">1</span>
              </button>
              <span class="page-focus-divider" aria-hidden="true"></span>
              <div class="page-tool-grid" role="group" aria-label="Selected page tools">
                <button id="rotate-left" class="tool-button" type="button" title="Rotate left ([)" aria-label="Rotate left" aria-keyshortcuts="[" disabled>
                  <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
                </button>
                <button id="rotate-right" class="tool-button" type="button" title="Rotate right (])" aria-label="Rotate right" aria-keyshortcuts="]" disabled>
                  <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
                </button>
                <button id="crop-toggle" class="tool-button" type="button" title="Crop page (C)" aria-label="Crop page" aria-keyshortcuts="c" disabled>
                  <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v14a2 2 0 0 0 2 2h14"></path><path d="M3 7h14a2 2 0 0 1 2 2v14"></path></svg>
                </button>
                <button id="delete-page" class="tool-button danger" type="button" title="Remove page (Backspace or Delete)" aria-label="Remove page" aria-keyshortcuts="Backspace Delete" disabled>
                  <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 3h6l1 4H8l1-4Z"></path><path d="M7 7l1 14h8l1-14"></path></svg>
                </button>
              </div>
            </div>
            <div id="crop-controls" class="crop-controls" hidden>
              <label id="crop-selected-option" class="check-field crop-selected-option" hidden>
                <input id="crop-apply-selected" type="checkbox">
                <span id="crop-selected-label">Apply to selection</span>
              </label>
              <div class="button-pair">
                <button id="crop-reset" class="button quiet small" type="button">Reset</button>
                <button id="crop-apply" class="button primary small" type="button" title="Apply crop (Enter)" aria-keyshortcuts="Enter">Apply</button>
              </div>
            </div>
          </section>

          <section class="session-section floating-sheet">
            <label class="field document-row">
              <span>Title</span>
              <input id="document-title" value="" aria-label="Document title">
            </label>
            <label class="field document-row">
              <span>File</span>
              <input id="output-filename" value="" aria-label="Output file name">
              <span id="output-extension" class="visually-hidden">.pdf</span>
            </label>
            <label class="field document-row output-format-field">
              <span>Format</span>
              <select id="output-format" aria-label="Format">
                <optgroup label="Documents">
                  <option value="pdf">PDF document</option>
                  <option value="tiff">TIFF document</option>
                </optgroup>
                <optgroup label="Page images">
                  <option value="zip-png">ZIP · PNG pages</option>
                  <option value="zip-jpeg">ZIP · JPEG pages</option>
                </optgroup>
              </select>
            </label>
            <p id="document-status" class="visually-hidden" aria-live="polite">Building document</p>
          </section>
        </div>

        <div id="history-panel" class="history-panel floating-sheet" hidden>
          <div id="history-list" class="history-list"></div>
        </div>

        <div class="document-actions">
          <button id="history-tab" class="icon-button history-button" type="button" title="Document history" aria-label="Document history" aria-pressed="false">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l3 2"></path></svg>
          </button>
          <button id="new-session" class="icon-button new-document-button" type="button" title="Start new document (⌘/Ctrl N)" aria-label="Start new document" aria-keyshortcuts="Meta+N Control+N">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"></path><path d="M14 3v6h6M12 13v5M9.5 15.5h5"></path></svg>
          </button>
          <button id="save-document" class="button primary" type="button" title="Save document (⌘/Ctrl S)" aria-keyshortcuts="Meta+S Control+S">Save</button>
          <button id="download-document" class="button quiet" type="button" title="Download document (⌘/Ctrl Shift S)" aria-keyshortcuts="Meta+Shift+S Control+Shift+S">Download</button>
        </div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js?v=workbench-37" defer></script>
</body>
</html>
