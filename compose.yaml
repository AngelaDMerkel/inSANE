services:
  insane:
    build:
      context: .
    image: insane:local
    container_name: insane
    restart: unless-stopped
    privileged: true
    ports:
      - "51234:8080"
    volumes:
      - /mnt/Array/databases/insane:/data/state
      - /mnt/Array/databases/paperless/consume:/data/output
    environment:
      InSane__Storage__StatePath: /data/state
      InSane__Storage__OutputPath: /data/output
      InSane__Scanner__EnableDemo: "false"
      InSane__Scanner__EsclSearchTimeoutMilliseconds: "5000"
      # Enable after configuring scanbd/scanbm and setting a default profile in the UI.
      InSane__Scanner__PhysicalButtonEnabled: "false"
      InSane__Scanner__PhysicalButtonToken: ""
