services:
  broker:
    image: docker.io/library/redis:7
    restart: unless-stopped
    volumes:
      - /mnt/Array/appdata/paperless/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    volumes:
      - /mnt/Array/appdata/paperless/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:?Set PAPERLESS_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - "8010:8000"
    volumes:
      - /mnt/Array/appdata/paperless/data:/usr/src/paperless/data
      - /mnt/Array/appdata/paperless/export:/usr/src/paperless/export
      - /mnt/Array/databases/paperless/media:/usr/src/paperless/media
      - /mnt/Array/databases/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:?Set PAPERLESS_DB_PASSWORD in .env}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?Set PAPERLESS_SECRET_KEY in .env}
      PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
      PAPERLESS_TIME_ZONE: America/New_York
      PAPERLESS_OCR_LANGUAGE: eng
      USERMAP_UID: ${PAPERLESS_UID:-568}
      USERMAP_GID: ${PAPERLESS_GID:-568}
      # Polling avoids missed Docker/ZFS or network-filesystem notifications.
      PAPERLESS_CONSUMER_POLLING_INTERVAL: "5"
      # inSANE publishes atomically; this adds a conservative consumer guard.
      PAPERLESS_CONSUMER_STABILITY_DELAY: "5"

  insane:
    image: ${INSANE_IMAGE:-docker.io/angeladmerkel/insane:1.0.0-amd64}
    platform: linux/amd64
    pull_policy: always
    container_name: insane
    restart: unless-stopped
    init: true
    privileged: true
    ports:
      - "51234:8080"
    volumes:
      - /mnt/Array/databases/insane:/data/state
      # This is the exact same host directory mounted as Paperless's consume directory.
      - /mnt/Array/databases/paperless/consume:/data/output
    environment:
      # The entrypoint prepares its mounts, then runs inSANE itself as Apps.
      PUID: ${PAPERLESS_UID:-568}
      PGID: ${PAPERLESS_GID:-568}
      InSane__Storage__StatePath: /data/state
      InSane__Storage__OutputPath: /data/output
      InSane__Scanner__EnableDemo: "false"
      InSane__Scanner__EsclSearchTimeoutMilliseconds: "5000"
      InSane__Scanner__PhysicalButtonEnabled: "false"
      InSane__Scanner__PhysicalButtonToken: ""
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
